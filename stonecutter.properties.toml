# Per-node dependency versions. When adding a node, add one table here.
# Table names are `[<loader>."<MC version>"]`, selected by `properties.tags(...)` in
# build.<loader>.gradle.kts.
#
# deps.xaero_worldmap / deps.xaero_minimap are the versions used for compilation and the dev client.
# deps.xaero_worldmap_min / deps.xaero_minimap_min are the "works from" lower bounds written into the mod metadata, and don't move when the versions above are bumped
# (NeoForge/Forge would refuse to launch for people with an older Xaero installed). When lowering a lower bound, build against that version and
# confirm that the references to Xaero (method and field types as seen with javap, and the refmap) are unchanged from a build against the current version.

# The node that actually runs the pathfinding tests. pathfinding/ depends on neither the loader nor the
# MC version (the iron rule of never writing //?), so running on one node verifies all nodes.
# Running on every node would just double the CI time wholesale without finding anything more.
canonical_test_node = "1.21.1-neoforge"

