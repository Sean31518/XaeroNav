modLoader="javafml"
loaderVersion="${neoforge_loader_version_range}"
license="${mod_license}"
issueTrackerURL="${mod_issue_tracker_url}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="${mod_display_url}"
description='''${mod_description}'''
logoFile="xaeronav_icon.png"

# Dedicated config holding only the Xaero integration (required=false). If Xaero isn't installed or the
# injection targets change, only this feature is disabled and the mod keeps working with in-world rendering
[[mixins]]
config="${mod_id}-xaero.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neoforge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_range_maven}"
ordering="NONE"
side="BOTH"

# Drawing the route on Xaero's World Map / Minimap and adding right-click menu entries is an optional
# integration (design doc §2-5). Without them this mod doesn't crash and works with in-world rendering
# (PathRenderer) alone.
#
# The versionRange lower bounds are the versions where the mixin injection targets (the endBatch call in
# GuiMap#render / MinimapFBORenderer#renderChunksToFBO, GuiMap#getRightClickOptions,
# WaypointReader#getRightClickOptions) were actually verified. Older versions have differently shaped
# targets; the required=false mixin config just silently disables itself, and all the user sees is
# "the route doesn't show on the map".
[[dependencies.${mod_id}]]
modId="xaeroworldmap"
type="optional"
versionRange="[${xaero_worldmap_min_version},)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="xaerominimap"
type="optional"
versionRange="[${xaero_minimap_min_version},)"
ordering="AFTER"
side="CLIENT"
