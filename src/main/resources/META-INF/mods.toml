modLoader="javafml"
loaderVersion="${forge_loader_version_range}"
license="${mod_license}"
issueTrackerURL="${mod_issue_tracker_url}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="${mod_display_url}"
description='''${mod_description}'''
logoFile="xaeronav_icon.png"

# A client-only mod, but Forge's @Mod has no dist designation, so the outer entrypoint is loaded on
# dedicated servers too. Client class references are isolated in Dist.CLIENT's nested setup so a mistaken install doesn't block startup.

# Dedicated config holding only the Xaero integration (required=false). If Xaero isn't installed or the injection target changes,
# only this feature is disabled and the mod itself keeps working with in-world rendering
[[mixins]]
config="${mod_id}-xaero.mixins.json"

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_loader_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_range_maven}"
ordering="NONE"
side="BOTH"

# Path rendering on Xaero's world map and minimap and the added right-click menu entries are an optional integration (design doc §2-5).
# Without it this mod doesn't crash and works with in-world rendering (PathRenderer) alone.
#
# The lower bound of versionRange is the version where the mixin injection targets (the endBatch call in
# GuiMap#render / MinimapFBORenderer#renderChunksToFBO, GuiMap#getRightClickOptions, WaypointReader#getRightClickOptions)
# were actually verified. In older versions the targets have a different shape and the required=false mixin config
# is just silently disabled, which users only see as "no path on the map".
[[dependencies.${mod_id}]]
modId="xaeroworldmap"
mandatory=false
versionRange="[${xaero_worldmap_min_version},)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="xaerominimap"
mandatory=false
versionRange="[${xaero_minimap_min_version},)"
ordering="AFTER"
side="CLIENT"
