org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# GitHub Actions' setup-gradle also saves the local build cache between runs.
# In particular, this avoids regenerating the transformed Minecraft dependency artifacts over and over.
org.gradle.caching=true
# ForgeGradle 7 dev runs need classes and resources merged into the same mod output.
# Left separate, the @Mod class can't be found from mods.toml and it stops at "constructed 0 mods".
net.minecraftforge.gradle.merge-source-sets=true
# Maven Central and others return 429s or time out when CI's parallel jobs all fetch at once.
# The defaults (3 attempts, short intervals, 30 seconds) can't ride out transient trouble and the whole job fails
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=2000
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=120000
