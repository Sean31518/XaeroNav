version: 2
updates:
  # Updates for Gradle plugins, JUnit, and dependencies (except Xaero).
  # NeoForge and Minecraft versions live in gradle.properties, so Dependabot doesn't cover them:
  # those are values the mod chooses deliberately, not something to bump automatically.
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gradle-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
