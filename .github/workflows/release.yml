name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (X.Y.Z)"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Do not cancel a release after a platform has accepted a file.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      nodes: ${{ steps.nodes.outputs.nodes }}
      canonical_node: ${{ steps.nodes.outputs.canonical_node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Resolve and validate release version
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Expected a vX.Y.Z tag"
              exit 1
            fi
          fi
          python3 tools/release_notes.py "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Reject an existing tag on manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG already exists. Use 'Re-run failed jobs' to recover a failed release."
            exit 1
          fi

      - name: Test release notes validation
        run: python3 -m unittest discover -s tools -p 'test_release_notes.py' -v

      # Tests and launch checks have already been done by CI for this commit, so the release doesn't repeat them and looks at the CI result
      # (running the canonical node's tests alone takes over 10 minutes and becomes the bottleneck of the build)
      - name: Require a green CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RESULT=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 1 \
            --json status,conclusion -q '.[0] | "\(.status)/\(.conclusion)"')
          if [ "$RESULT" != "completed/success" ]; then
            echo "::error::CI for $GITHUB_SHA is not green yet ($RESULT). Wait for CI on main before releasing."
            exit 1
          fi

      # Configuring all nodes prepares Minecraft one by one and takes over 40 minutes. The list also includes unconfigured nodes,
      # so configuring only the canonical node is enough
      - name: Discover release nodes
        id: nodes
        run: |
          CANON=$(grep '^canonical_test_node' stonecutter.properties.toml | cut -d'"' -f2)
          NODES=$(./gradlew printNodes "-Pxaeronav.onlyNodes=$CANON" -q --console=plain | tail -1)
          echo "$NODES" | jq -e 'length > 0' > /dev/null
          echo "nodes=$NODES" >> "$GITHUB_OUTPUT"
          echo "canonical_node=$CANON" >> "$GITHUB_OUTPUT"

      # The publish jobs also configure only the canonical node, so the Gradle home created from scratch here can be used as-is.
      # Left to setup-gradle, the publish jobs had no entry of their own and restored another job's huge cache for all nodes,
      # taking over 2 minutes per entry
      - name: Stop the Gradle daemon before caching
        run: ./gradlew --stop
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: release-publish-gradle-${{ github.run_id }}

  # Build each node on a separate runner. Building all nodes in sequence on one machine takes nearly 20 minutes
  build:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node: ${{ fromJson(needs.discover.outputs.nodes) }}
    name: build (${{ matrix.node.node }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      # Only borrow the cache of CI's build job. Anything written from a release gets evicted before the next release
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Build and verify the distribution jar
        env:
          RELEASE_VERSION: ${{ needs.discover.outputs.version }}
          NODE: ${{ matrix.node.node }}
        run: ./gradlew verifyDistribution --console=plain -Prelease "-Pmod_version=$RELEASE_VERSION" "-Pxaeronav.onlyNodes=$NODE"

      # Like the publish jobs, configure and test only the canonical node
      - name: Dry run every platform
        env:
          RELEASE_VERSION: ${{ needs.discover.outputs.version }}
          NODE: ${{ matrix.node.node }}
          LOADER: ${{ matrix.node.loader }}
          MINECRAFT: ${{ matrix.node.minecraft }}
          CANONICAL_NODE: ${{ needs.discover.outputs.canonical_node }}
          MODRINTH_PROJECT_ID: example
          MODRINTH_TOKEN: example
          CURSEFORGE_PROJECT_ID: "123456"
          CURSEFORGE_TOKEN: example
        run: |
          set -euo pipefail
          for PLATFORM in modrinth curseforge; do
            OUTPUT=$(./gradlew publishMods --console=plain -Prelease \
              "-Pmod_version=$RELEASE_VERSION" "-Ppublish_target=$PLATFORM" \
              "-Ppublish_node=$NODE" "-Pxaeronav.onlyNodes=$CANONICAL_NODE" -Ppublish_dry_run=true)
            grep -Fq "Main file: xaeronav-$RELEASE_VERSION-$LOADER-$MINECRAFT.jar" <<< "$OUTPUT"
            grep -Fq "Version: $RELEASE_VERSION-$LOADER-$MINECRAFT" <<< "$OUTPUT"
            echo "Verified $PLATFORM / $NODE"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-jar-${{ matrix.node.node }}
          path: build/libs/xaeronav-*.jar
          if-no-files-found: error
          retention-days: 30

  credentials:
    runs-on: ubuntu-latest
    steps:
      - name: Verify publishing configuration
        env:
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          for NAME in MODRINTH_PROJECT_ID MODRINTH_TOKEN CURSEFORGE_PROJECT_ID CURSEFORGE_TOKEN; do
            if [ -z "${!NAME}" ]; then
              echo "::error::$NAME is not configured"
              exit 1
            fi
          done
          if ! curl -fsS --retry 3 --max-time 15 \
            "https://api.modrinth.com/v2/project/$MODRINTH_PROJECT_ID" \
            | jq -e '.slug == "xaeronav"' > /dev/null; then
            echo "::error::MODRINTH_PROJECT_ID does not identify the XaeroNav project"
            exit 1
          fi

  tag:
    needs: [discover, build, credentials]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create tag for a manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ needs.discover.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

  publish:
    needs: [discover, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      # The limit on concurrent jobs with GitHub Pro (beyond this they just wait).
      # One upload is a few requests, so it stays under the Modrinth (300 per minute per IP) and CurseForge limits
      max-parallel: 40
      matrix:
        platform: [modrinth, curseforge]
        node: ${{ fromJson(needs.discover.outputs.nodes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: release-publish-gradle-${{ github.run_id }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-jar-${{ matrix.node.node }}
          path: build/libs

      - name: Check publication inputs
        env:
          RELEASE_VERSION: ${{ needs.discover.outputs.version }}
          MINECRAFT: ${{ matrix.node.minecraft }}
          LOADER: ${{ matrix.node.loader }}
          PLATFORM: ${{ matrix.platform }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          python3 tools/release_notes.py "$RELEASE_VERSION"
          test -f "build/libs/xaeronav-$RELEASE_VERSION-$LOADER-$MINECRAFT.jar"
          if [ "$PLATFORM" = modrinth ]; then
            test -n "$MODRINTH_PROJECT_ID" && test -n "$MODRINTH_TOKEN"
          else
            test -n "$CURSEFORGE_PROJECT_ID" && test -n "$CURSEFORGE_TOKEN"
          fi

      - name: Publish ${{ matrix.node.node }} to ${{ matrix.platform }}
        env:
          RELEASE_VERSION: ${{ needs.discover.outputs.version }}
          NODE: ${{ matrix.node.node }}
          PLATFORM: ${{ matrix.platform }}
          CANONICAL_NODE: ${{ needs.discover.outputs.canonical_node }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        # Uploading only sends already-built jars, so the publish nodes aren't configured (configuring would prepare that node's Minecraft)
        run: ./gradlew publishMods -Prelease "-Pmod_version=$RELEASE_VERSION" "-Ppublish_target=$PLATFORM" "-Ppublish_node=$NODE" "-Pxaeronav.onlyNodes=$CANONICAL_NODE"

  github_release:
    needs: [discover, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-jar-*
          merge-multiple: true
          path: build/libs
      - name: Validate release assets and notes
        env:
          RELEASE_VERSION: ${{ needs.discover.outputs.version }}
          RELEASE_NODES: ${{ needs.discover.outputs.nodes }}
        run: |
          python3 tools/release_notes.py "$RELEASE_VERSION"
          test "$(find build/libs -maxdepth 1 -name 'xaeronav-*.jar' | wc -l | tr -d ' ')" = "$(jq 'length' <<< "$RELEASE_NODES")"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.discover.outputs.tag }}
          name: ${{ needs.discover.outputs.tag }}
          body_path: changelogs/${{ needs.discover.outputs.version }}.md
          draft: false
          generate_release_notes: false
          files: build/libs/xaeronav-*.jar
          fail_on_unmatched_files: true
