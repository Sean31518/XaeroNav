name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Regular PRs narrow runtime to the canonical node only, so check Xaero hook connectivity on
    # all nodes once a week
    - cron: "0 3 * * 1"

# Read-only. The build never writes back to the repository
permissions:
  contents: read

# Cancel older runs when pushing to the same branch in succession.
# NeoForge's first-time setup alone takes about 5 minutes, so letting runs pile up only grows the wait
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A lightweight job that only fetches the node list and decides whether to widen runtime to all nodes.
  # Splitting this out first lets the build job below be a per-node matrix
  # (printNodes takes only a few seconds in Gradle's configuration phase; no need to wait for a full build).
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      nodes: ${{ steps.nodes.outputs.nodes }}
      runtime_nodes: ${{ steps.nodes.outputs.runtime_nodes }}
      server_nodes: ${{ steps.nodes.outputs.server_nodes }}
      server_required: ${{ steps.full.outputs.server_required }}
      canonical_node: ${{ steps.nodes.outputs.canonical_node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      # Writing a dedicated cache from a node-discovery-only job is barely reusable by later builds
      # and only adds save/eviction cost.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      # Conditions for widening runtime to all nodes: a push to main, the weekly schedule, or
      # a PR touching node definitions, Xaero mixins, or the runtime probe's execution path.
      # Other regular PRs are narrowed to the canonical node, so the total number of runtime
      # jobs doesn't grow linearly as MC version nodes are added.
      #
      # The Forge server smoke breaks not only through classes referenced directly from the outer
      # entrypoint but also when client types leak into common classes further down. All Java/resource
      # changes are included so future dependency changes aren't missed by forgetting to add them to this regex
      - name: Decide whether to run the full runtime matrix
        id: full
        run: |
          FULL=false
          SERVER=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            FULL=true
            SERVER=true
          elif [ "${{ github.event_name }}" = "push" ]; then
            FULL=true
            SERVER=true
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
            if echo "$CHANGED" | grep -qE '^(stonecutter\.properties\.toml|settings\.gradle\.kts|src/main/java/net/prason/xaeronav/mixin/|src/main/java/net/prason/xaeronav/client/ClientTickHandler\.java|src/main/java/net/prason/xaeronav/xaero/XaeroHook(Probe|RuntimeProbe)\.java|src/main/resources/.*\.mixins\.json)'; then
              FULL=true
            fi
            if echo "$CHANGED" | grep -qE '^(\.github/workflows/ci\.yml|stonecutter\.properties\.toml|settings\.gradle\.kts|gradle\.properties|gradle/|buildSrc/|build(\.forge(-legacy|-116)?|\.fabric|\.neoforge)?\.gradle\.kts|stonecutter\.gradle\.kts|src/main/(java|resources)/)'; then
              SERVER=true
            fi
          fi
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "server_required=$SERVER" >> "$GITHUB_OUTPUT"

      # Keep node definitions only in settings.gradle.kts
      - id: nodes
        run: |
          CANON=$(grep '^canonical_test_node' stonecutter.properties.toml | cut -d'"' -f2)
          # Configuring all nodes rebuilds Minecraft one by one for nodes missing from the borrowed Gradle cache, taking over 20 minutes.
          # The list also contains nodes settings.gradle.kts doesn't configure, so configuring only the canonical node is enough
          NODES=$(./gradlew printNodes "-Pxaeronav.onlyNodes=$CANON" --console=plain | tee /dev/stderr | grep '^\[{')
          echo "nodes=$NODES" >> "$GITHUB_OUTPUT"
          echo "canonical_node=$CANON" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.full.outputs.full }}" = "true" ]; then
            RUNTIME=$NODES
          else
            RUNTIME=$(echo "$NODES" | jq -c --arg c "$CANON" '[.[] | select(.node == $c)]')
          fi
          # mc-runtime-test hasn't published a build for 26.3 yet (4.5.1 goes up to 26.2). Remove once it does
          RUNTIME=$(echo "$RUNTIME" | jq -c '[.[] | select(.minecraft != "26.3")]')
          echo "runtime_nodes=$RUNTIME" >> "$GITHUB_OUTPUT"
          SERVER=$(echo "$NODES" | jq -c '[.[] | select(.loader == "forge")]')
          echo "server_nodes=$SERVER" >> "$GITHUB_OUTPUT"

  # Compile the distribution jars of all nodes. Format checks and tests (including slowTest) run
  # only on the canonical node that shares the sources (canonical_test_node in stonecutter.properties.toml).
  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJson(needs.discover.outputs.nodes) }}
    name: build (${{ matrix.node.node }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # xaeronav.onlyNodes configures only the node(s) this job uses (and the canonical node) (see settings.gradle.kts).
      # Pathfinding tests are the same on all nodes, so they are compiled and run only on the canonical node.
      # Calling build on other nodes would recompile the same sources up to compileTestJava even though
      # Test itself stops via onlyIf, so only assemble, needed to verify the distribution jars, is used.
      - name: Build and verify
        env:
          NODE: ${{ matrix.node.node }}
          CANONICAL_NODE: ${{ needs.discover.outputs.canonical_node }}
        run: |
          if [ "$NODE" = "$CANONICAL_NODE" ]; then
            ./gradlew spotlessCheck ":$NODE:build" "-Pxaeronav.onlyNodes=$NODE" --console=plain
          else
            ./gradlew ":$NODE:assemble" "-Pxaeronav.onlyNodes=$NODE" --console=plain
          fi

      # On failure, make it possible to see which test failed and why without digging through logs
      - name: Upload test report
        if: failure() && matrix.node.node == needs.discover.outputs.canonical_node
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report-${{ matrix.node.node }}
          path: |
            versions/${{ matrix.node.node }}/build/reports/tests/test
            versions/${{ matrix.node.node }}/build/reports/tests/slowTest
          retention-days: 7

      # Make it possible to download the actual jar from a PR and try it out
      - name: Upload mod jar
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xaeronav-jar-${{ matrix.node.node }}
          path: versions/${{ matrix.node.node }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  # Actually launch Minecraft and see whether it gets as far as entering a world.
  #
  # The Xaero integration mixins are required=false, so if the injection target changes no exception is thrown; "no line on the map" is all you get.
  # A passing build guarantees nothing, so CI's job extends to launching and reading the log.
  runtime:
    # runtime builds the distribution jar itself, so there's no need to wait for the build matrix.
    # Running the canonical node with the heavy slowTest in parallel with the Minecraft launch check cuts
    # CI's overall critical path from "build + runtime" to "only the longer one".
    needs: discover
    runs-on: ubuntu-latest
    # With only steps' timeout-minutes, a hang outside a step holds the required check for the default 6 hours.
    # Usually 3-4 minutes. If the whole runner stops responding, even this may not stop it
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJson(needs.discover.outputs.runtime_nodes) }}
    name: runtime (${{ matrix.node.node }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      # The build matrix caches the same Gradle dependencies. Writing similar caches per node from the
      # runtime matrix too would eat capacity, so this only restores.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Build and stage mods
        run: ./gradlew :${{ matrix.node.node }}:stageRuntimeTestMods -Pxaeronav.onlyNodes=${{ matrix.node.node }} --console=plain

      - name: Put mods into the test client
        run: |
          mkdir -p run/mods
          cp build/runtime-test/${{ matrix.node.node }}/mods/*.jar run/mods/

      # The fabric-api distribution jar is taken from the release tag (the value of deps.fabric_api itself). Leaving it to mc-runtime-test
      # builds the tag as `<version>+<MC version>`, so it can't fetch tags with a rounded MC version like `0.42.0+1.16`
      - name: Put fabric-api into the test client
        if: matrix.node.loader == 'fabric'
        env:
          GH_TOKEN: ${{ github.token }}
          FABRIC_API: ${{ matrix.node.fabric_api }}
        run: gh release download "$FABRIC_API" -R FabricMC/fabric-api -p "fabric-api-$FABRIC_API.jar" -D run/mods

      # HeadlessMC and Minecraft run on JAVA_HOME as of this point. After the Gradle build (Java 25) finishes,
      # switch to the same Java users have
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: matrix.node.java != '25'
        with:
          distribution: temurin
          java-version: ${{ matrix.node.java }}

      # The Forge/NeoForge loading screen (early display) can time out preparing a window under Xvfb,
      # and then enters an infinite loop asking y/n on stdin. The flood of output makes the whole runner
      # unresponsive and it gets killed with neither the step timeout nor the stall watch taking effect,
      # so leave the loading screen to vanilla
      # (seen on NeoForge 1.21.3. The key is the same as Forge: https://neoforged.net/meta/displayerrors/)
      - name: Disable the Forge early display
        if: (matrix.node.loader == 'forge' && matrix.node.minecraft != '1.16.5') || matrix.node.loader == 'neoforge'
        run: |
          mkdir -p run/config
          echo "earlyWindowControl = false" > run/config/fml.toml

      # After entering the world and passing the test, the JVM sometimes hangs without exiting
      # (seen on both loaders. The last log line is the server finishing its save; it never gets as far
      # as ending the Xaero session). If killed, nothing is left in the log, so once
      # the log stops growing, take stacks, kill the client and move on
      - name: Watch for a stalled client
        run: |
          nohup bash -c '
            # Launch to exit normally takes about 60 seconds, with log output continuing throughout.
            # If it has been completely stalled for 5 minutes, waiting will not help
            STALL=300
            while [ "$SECONDS" -lt 1500 ]; do
              sleep 15
              LOG=run/logs/latest.log
              [ -f "$LOG" ] || continue
              IDLE=$(( $(date +%s) - $(stat -c %Y "$LOG") ))
              THRESHOLD=$STALL
              # The known case where only shutdown hangs after the in-game test succeeded
              # is diagnosed and terminated after a 30-second grace period instead of 5 minutes.
              if grep -Fq "No tests found, Successfully finished." "$LOG" \
                  && grep -Fq "All dimensions are saved" "$LOG"; then
                THRESHOLD=30
              fi
              [ "$IDLE" -ge "$THRESHOLD" ] || continue
              PIDS=$(fuser "$LOG" 2>/dev/null || true)
              {
                echo "=== Log has not grown for ${THRESHOLD}s. Taking stacks ($(date -u)) ==="
                for PID in ${PIDS:-$(pgrep -f java || true)}; do
                  echo "--- pid=$PID"
                  tr "\0" " " < "/proc/$PID/cmdline" 2>/dev/null; echo
                  "$JAVA_HOME/bin/jstack" -l "$PID" 2>&1 || true
                done
              } > run/logs/threaddump.txt 2>&1
              # Kill only when fuser identified the process. Taking down all java would also take
              # the Gradle daemon with it, breaking the subsequent cache save
              [ -n "$PIDS" ] && kill -9 $PIDS
              exit 0
            done
          ' > /dev/null 2>&1 &

      # Last line of defence when the watch above didn't work. Even if killed here, the subsequent
      # log output and upload run with `if: always()`, so material for tracking down the cause remains
      - name: Run the client
        id: client
        timeout-minutes: 20
        continue-on-error: true
        uses: headlesshq/mc-runtime-test@fbafe02f89f4f13682e7b16dbcee6b6a43f4faca # 4.5.1
        with:
          mc: ${{ matrix.node.minecraft }}
          modloader: ${{ matrix.node.loader }}
          regex: .*${{ matrix.node.loader }}.*
          java: ${{ matrix.node.java }}
          # The mc-runtime-test distribution is released under a different name, "lexforge", for Forge only
          # (distinct from the modloader argument "forge". See headlesshq/mc-runtime-test's action.yml)
          mc-runtime-test: ${{ matrix.node.loader == 'forge' && 'lexforge' || matrix.node.loader }}
          fabric-api: none
          # HeadlessMC's --jvm passes a single value as-is as a JVM argument. Combining two separated by
          # a space puts the second into java.awt.headless's value, and it doesn't become a probe property.
          headlessmc-command: '--jvm "-Dxaeronav-ci.runtimeHookProbe=true"'

      # Fetching Minecraft, the loader and mc-runtime-test fails on transient problems at external distributors. Retry once only
      # when it failed before the game launched (no log). Failures after launch would be the same on retry, so they go to the checks below.
      # Failing mid-fetch leaves only the version json, and the action sees it as "installed" and skips the fetch, so clear the version list first
      - name: Reset the partial Minecraft install
        if: steps.client.outcome == 'failure' && hashFiles('run/logs/latest.log') == ''
        run: rm -rf ~/.minecraft/versions

      - name: Run the client (retry)
        id: client_retry
        if: steps.client.outcome == 'failure' && hashFiles('run/logs/latest.log') == ''
        timeout-minutes: 20
        continue-on-error: true
        uses: headlesshq/mc-runtime-test@fbafe02f89f4f13682e7b16dbcee6b6a43f4faca # 4.5.1
        with:
          mc: ${{ matrix.node.minecraft }}
          modloader: ${{ matrix.node.loader }}
          regex: .*${{ matrix.node.loader }}.*
          java: ${{ matrix.node.java }}
          mc-runtime-test: ${{ matrix.node.loader == 'forge' && 'lexforge' || matrix.node.loader }}
          fabric-api: none
          headlessmc-command: '--jvm "-Dxaeronav-ci.runtimeHookProbe=true"'

      # When launch fails or hangs, make this the first place to read
      # (complete within the job log without downloading the artifact)
      - name: Show the client log
        if: always()
        run: |
          if [ -f run/logs/threaddump.txt ]; then
            echo "::group::run/logs/threaddump.txt (the client was stalled)"
            cat run/logs/threaddump.txt
            echo "::endgroup::"
          fi
          if [ -f run/logs/latest.log ]; then
            echo "::group::run/logs/latest.log (last 200 lines)"
            tail -200 run/logs/latest.log
            echo "::endgroup::"
          else
            echo "run/logs/latest.log is missing"
            ls -la run/ 2>/dev/null || true
          fi

      # Even when the in-game test completed, mc-runtime-test returns exit 137 as a failure if the
      # watchdog kills Minecraft's shutdown hang. Real failures aren't hidden; only shutdown hangs
      # where both test success and world save completion were recorded are rescued.
      - name: Validate the runtime result
        if: always()
        env:
          CLIENT_OUTCOME: ${{ steps.client_retry.outcome == 'skipped' && steps.client.outcome || steps.client_retry.outcome }}
        run: |
          if [ "$CLIENT_OUTCOME" = success ]; then
            exit 0
          fi

          LOG=run/logs/latest.log
          if [ -f "$LOG" ] \
              && grep -Fq "No tests found, Successfully finished." "$LOG" \
              && grep -Fq "All dimensions are saved" "$LOG"; then
            echo "::warning::In-game test and save completed. Treating only the shutdown hang as success"
            exit 0
          fi

          echo "::error::Minecraft launch test did not complete (outcome=$CLIENT_OUTCOME)"
          exit 1

      # A mixin failing to apply only shows up in the log (the config is required=false, so nothing crashes).
      # A log nobody reads might as well not exist, so fail CI here if one is found
      - name: Check that the Xaero hooks applied
        if: always()
        run: |
          LOG=run/logs/latest.log
          if [ ! -f "$LOG" ]; then
            echo "::error::$LOG is missing. The client may not have launched"
            exit 1
          fi
          if grep -nE 'Mixin apply failed.*xaeronav|Critical injection failure.*xaeronav|xaeronav-xaero\.mixins\.json.*(failed|error)' "$LOG"; then
            echo "::error::XaeroNav mixins did not apply. The Xaero version may be outside the supported range"
            exit 1
          fi
          for HOOK in WORLD_MAP WAYPOINT_MENU MINIMAP; do
            if ! grep -Fq "XAERONAV_HOOK_APPLIED $HOOK" "$LOG"; then
              echo "::error::XaeroNav mixin apply success marker missing: $HOOK"
              exit 1
            fi
          done
          echo "Confirmed all XaeroNav mixins applied successfully"

      # The marker above only checks that the mixin interface was attached to the target class. Exercise
      # the actual render, key and menu injection points through the runtime probe and positively assert each callback's marker separately.
      - name: Check that every Xaero hook executed
        if: always()
        run: |
          LOG=run/logs/latest.log
          if [ ! -f "$LOG" ]; then
            echo "::error::$LOG is missing. Cannot check the runtime hook probe"
            exit 1
          fi
          if grep -Fq "XAERONAV_RUNTIME_HOOK_PROBE_FAILED" "$LOG"; then
            grep -F "XAERONAV_RUNTIME_HOOK_PROBE_FAILED" "$LOG"
            echo "::error::Xaero runtime hook probe failed"
            exit 1
          fi
          for HOOK in WORLD_MAP_RENDER MINIMAP_RENDER WORLD_MAP_KEY WORLD_MAP_MENU WAYPOINT_MENU; do
            if ! grep -Fq "XAERONAV_HOOK_EXECUTED $HOOK" "$LOG"; then
              echo "::error::XaeroNav mixin execution success marker missing: $HOOK"
              exit 1
            fi
          done
          if ! grep -Fq "XAERONAV_RUNTIME_HOOK_PROBE_SUCCESS" "$LOG"; then
            echo "::error::Xaero runtime hook probe completion marker missing"
            exit 1
          fi
          echo "Confirmed all XaeroNav mixin injection points executed"

      - name: Upload client logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-log-${{ matrix.node.node }}
          path: |
            run/logs
            run/crash-reports
          if-no-files-found: warn
          retention-days: 7

  # XaeroNav is client-only and doesn't need to be installed on servers. However, Forge's @Mod has
  # no client-only designation and the outer entrypoint is loaded on dedicated servers too, so verify
  # that placing the distribution jar in server mods by mistake doesn't block startup via early client class loading.
  server:
    needs: discover
    if: needs.discover.outputs.server_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJson(needs.discover.outputs.server_nodes) }}
    name: server (${{ matrix.node.node }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # JVM running Gradle 9.8.0 and Stonecutter 0.9.8 (Loom for 26.x Fabric requires 25). The 1.20.1 mod itself is Java 17 via toolchain.
          java-version: 25

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Build and stage the production mod jar
        run: ./gradlew :${{ matrix.node.node }}:stageServerTestMod -Pxaeronav.onlyNodes=${{ matrix.node.node }} --console=plain

      - name: Put XaeroNav into the test server
        run: |
          mkdir -p run/mods
          cp build/server-test/${{ matrix.node.node }}/mods/*.jar run/mods/

      # HeadlessMC registers JAVA_HOME as of this point as the server JVM. Separate from Gradle, run on the same Java users have
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.node.java }}

      # mc-server-test positively waits for the world to finish loading, then sends stop once reached.
      # Pinned not to a mutable tag but to the signed commit of v1.1.1, whose contents were reviewed.
      - name: Run the Forge dedicated server
        id: server
        continue-on-error: true
        uses: headlesshq/mc-server-test@42de00da95e997b046a43eb9beb516494e542ba9 # v1.1.1
        with:
          mc: ${{ matrix.node.minecraft }}
          modloader: forge
          java: ${{ matrix.node.java }}

      # Fetching the Forge installer fails on transient problems at the distributor (after a timeout, HeadlessMC switches
      # to a URL of a different format and gets a 404). Retry once only when it failed before the server started (no log).
      # A server directory left over from a mid-fetch failure would be launched as entry 0 on retry, so delete it
      - name: Reset the partial server install
        if: steps.server.outcome == 'failure' && hashFiles('run/logs/latest.log') == ''
        run: rm -rf HeadlessMC/servers ~/.minecraft/servers

      - name: Run the Forge dedicated server (retry)
        id: server_retry
        if: steps.server.outcome == 'failure' && hashFiles('run/logs/latest.log') == ''
        uses: headlesshq/mc-server-test@42de00da95e997b046a43eb9beb516494e542ba9 # v1.1.1
        with:
          mc: ${{ matrix.node.minecraft }}
          modloader: forge
          java: ${{ matrix.node.java }}

      # Fail here on failures after launch (ones not retried)
      - name: Fail if the server did not start cleanly
        if: steps.server.outcome == 'failure' && steps.server_retry.outcome == 'skipped'
        run: |
          echo "::error::Forge dedicated server launch test failed"
          exit 1

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-log-${{ matrix.node.node }}
          path: |
            run/logs
            run/crash-reports
          if-no-files-found: warn
          retention-days: 7
